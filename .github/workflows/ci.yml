name: CI

# Gives each run in the Actions list a title that actually says what shipped, instead of
# a generic duplicate of the workflow name -- pulls the CR#/commit message that's already
# in every release.ps1 commit, plus which branch triggered it.
run-name: >-
  CI: ${{ github.event.pull_request.title || github.event.head_commit.message }} (${{ github.ref_name }})

on:
  push:
    branches: [staging]
  pull_request:
    # main: the hard gate before production -- this check is required via branch
    # protection on main, so a failing run blocks the merge/push button outright.
    # staging: gives the same pre-merge visibility + blockability for
    # development->staging PRs (paired with a required-status-check rule on staging),
    # rather than only finding out after the merge already landed.
    branches: [main, staging]

# Security release: explicit least-privilege token scope. Without this, the default
# GITHUB_TOKEN for this workflow gets broad read/write permissions to the repo (contents,
# issues, PRs, etc.) even though this job only ever checks out code and runs tests -- it
# never needs to write anything. Pinning to read-only limits the blast radius if the
# workflow or an action it depends on is ever compromised.
permissions:
  contents: read

jobs:
  test:
    # Shows as "CI / Regression test pack" in the PR checks widget and branch protection's
    # required-status-check picker, instead of the generic "CI / test".
    name: Regression test pack
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Tech debt: Node 20 reached end-of-life April 30, 2026 (no more security patches).
          # Node 24 is the current Active LTS line (supported until April 30, 2028); Node 22
          # is Maintenance LTS (still receiving CVE fixes until April 2027) and would also be
          # a valid choice, but 24 gives the longest support runway.
          node-version: 24

      - name: Syntax-check all JavaScript files
        run: |
          set -e
          find . -type d \( -name node_modules -o -name .git \) -prune -o -type f -name '*.js' -print | while read -r f; do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Run regression test suite
        run: node --test  
