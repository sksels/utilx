name: CI

# Gives each run in the Actions list a title that actually says what shipped, instead of
# a generic duplicate of the workflow name -- pulls the CR#/commit message that's already
# in every release.ps1 commit, plus which branch triggered it.
run-name: >-
  CI: ${{ github.event.pull_request.title || github.event.head_commit.message }} (${{ github.ref_name }})

on:
  push:
    branches: [staging]
  pull_request:
    # main: the hard gate before production -- this check is required via branch
    # protection on main, so a failing run blocks the merge/push button outright.
    # staging: gives the same pre-merge visibility + blockability for
    # development->staging PRs (paired with a required-status-check rule on staging),
    # rather than only finding out after the merge already landed.
    branches: [main, staging]

# Security release: explicit least-privilege token scope. Without this, the default
# GITHUB_TOKEN for this workflow gets broad read/write permissions to the repo (contents,
# issues, PRs, etc.) even though this job only ever checks out code and runs tests -- it
# never needs to write anything. Pinning to read-only limits the blast radius if the
# workflow or an action it depends on is ever compromised.
permissions:
  contents: read

jobs:
  test:
    # Shows as "CI / Regression test pack" in the PR checks widget and branch protection's
    # required-status-check picker, instead of the generic "CI / test".
    name: Regression test pack
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Tech debt: Node 20 reached end-of-life April 30, 2026 (no more security patches).
          # Node 24 is the current Active LTS line (supported until April 30, 2028); Node 22
          # is Maintenance LTS (still receiving CVE fixes until April 2027) and would also be
          # a valid choice, but 24 gives the longest support runway.
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check all JavaScript files
        run: |
          set -e
          find . -type d \( -name node_modules -o -name .git -o -name dist \) -prune -o -type f -name '*.js' -print | while read -r f; do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Lint CSS (design-token enforcement, duplicate-selector detection)
        run: npm run lint:css

      - name: Astro build (validates the site actually builds)
        run: npm run build

      - name: Run regression test suite
        run: node --test

      - name: Install Playwright's Chromium
        # Only Chromium, not the full browser matrix -- keeps CI fast, and the layout/a11y
        # assertions below don't need cross-browser coverage to catch what they're built to
        # catch. This step needs normal internet access, which is why it can't run in this
        # project's Claude sandbox (blocked by that sandbox's network allowlist) but works
        # fine here in GitHub Actions.
        run: npx playwright install --with-deps chromium

      - name: Layout-assertion + accessibility tests (Playwright)
        run: npm run test:e2e

      - name: Performance budgets (Lighthouse CI)
        # First real run of this gate -- the error thresholds below (LCP, CLS, overall
        # performance score) are standard "good" Core Web Vitals targets, not numbers
        # calibrated against this site's actual measured performance (Lighthouse can't run
        # in this project's Claude sandbox either -- same network-allowlist constraint as
        # Chromium/Playwright above). If this fails on its first run, that's real signal to
        # act on, not a false alarm to loosen blindly: check the uploaded report link in the
        # job output before changing any threshold in .lighthouserc.json.
        run: npm run test:perf
