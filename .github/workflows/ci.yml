name: CI

# Gives each run in the Actions list a title that actually says what shipped, instead of
# a generic duplicate of the workflow name -- pulls the CR#/commit message that's already
# in every release.ps1 commit, plus which branch triggered it.
run-name: >-
  CI: ${{ github.event.head_commit.message }} (${{ github.ref_name }})

# Design (Aug 21 2026): pure push-triggered, no pull_request checks, no merge-blocking gate.
# Three stages, one job each, each scoped to what that branch is actually for:
#
# - development-tests: full functional pack (lint, build, unit tests, Playwright), minus
#   Lighthouse. Fires immediately on every push to development -- this is where new-feature
#   bugs get caught, right after the push that introduced them, and where iteration happens.
# - performance: build + Lighthouse only. Fires on push to staging. Functional correctness
#   was already proven by development-tests against this same code; re-running the full pack
#   here would be re-testing an unchanged input. Performance budgets are the one thing that
#   pack doesn't cover.
# - sanity: build + unit tests only (fast, no Playwright/Lighthouse). Fires on push to main.
#   Can't block anything after the fact, but gives an immediate automated signal if something
#   is visibly broken on the branch that drives the production deploy.
#
# Deliberately no pull_request trigger and no branch-protection required-status-check (backlog
# #117, closed as "not applicable to this design" rather than done) -- there's no PR-attached
# check for protection to gate on, so promotion safety is procedural: check the previous
# stage's run was green before promoting, not a technical block on the merge button. That's
# the right tradeoff for a single-maintainer pipeline with no parallel/forked development.
# Revisit this (add pull_request triggers + branch protection back) if the project ever grows
# multiple forks or parallel contributors, where "trust the last push was checked" no longer
# holds.
on:
  push:
    branches: [development, staging, main]

# Security release: explicit least-privilege token scope. Without this, the default
# GITHUB_TOKEN for this workflow gets broad read/write permissions to the repo (contents,
# issues, PRs, etc.) even though these jobs only ever check out code and run tests -- they
# never need to write anything. Pinning to read-only limits the blast radius if the
# workflow or an action it depends on is ever compromised.
permissions:
  contents: read

jobs:
  development-tests:
    name: Development test pack
    if: github.ref_name == 'development'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Tech debt: Node 20 reached end-of-life April 30, 2026 (no more security patches).
          # Node 24 is the current Active LTS line (supported until April 30, 2028); Node 22
          # is Maintenance LTS (still receiving CVE fixes until April 2027) and would also be
          # a valid choice, but 24 gives the longest support runway.
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check all JavaScript files
        run: |
          set -e
          find . -type d \( -name node_modules -o -name .git -o -name dist \) -prune -o -type f -name '*.js' -print | while read -r f; do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Lint CSS (design-token enforcement, duplicate-selector detection)
        run: npm run lint:css

      - name: Astro build (validates the site actually builds)
        run: npm run build

      - name: Run unit test suite
        run: node --test

      - name: Install Playwright's Chromium
        # Only Chromium, not the full browser matrix -- keeps CI fast, and the layout/a11y
        # assertions below don't need cross-browser coverage to catch what they're built to
        # catch. This step needs normal internet access, which is why it can't run in this
        # project's Claude sandbox (blocked by that sandbox's network allowlist) but works
        # fine here in GitHub Actions.
        run: npx playwright install --with-deps chromium

      - name: Layout-assertion + accessibility tests (Playwright)
        run: npm run test:e2e

  performance:
    name: Performance gate
    if: github.ref_name == 'staging'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Astro build (Lighthouse audits the static output directly)
        run: npm run build

      - name: Performance budgets (Lighthouse CI)
        # The error thresholds below (LCP, CLS, overall performance score) are standard
        # "good" Core Web Vitals targets, not numbers calibrated against this site's actual
        # measured performance (Lighthouse can't run in this project's Claude sandbox --
        # blocked by that sandbox's network allowlist -- so this has only ever run in CI).
        # If this fails, that's real signal to act on, not a false alarm to loosen blindly:
        # check the uploaded report link in the job output before changing any threshold in
        # .lighthouserc.json.
        run: npm run test:perf

  sanity:
    name: Production sanity check
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Astro build (validates the site actually builds)
        run: npm run build

      - name: Run unit test suite
        run: node --test
