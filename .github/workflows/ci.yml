name: CI

on:
  push:
    branches: [staging]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax-check all JavaScript files
        run: |
          set -e
          find . -type d \( -name node_modules -o -name .git \) -prune -o -type f -name '*.js' -print | while read -r f; do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Run regression test suite
        run: node --test  
