# Automated dependency-update PRs. This is the piece I can commit myself -- it does NOT
# turn on Dependabot's separate security-alert scanning (that's a repo Settings > Code
# security toggle, not a file, so it needs to be done once in the GitHub UI; see the
# handoff notes for the exact steps).
#
# target-branch: "development" on both ecosystems below -- this repo promotes
# development -> staging -> main by hand (see RELEASE_PROCESS.md), and Dependabot PRs
# default to opening against the repo's default branch (main). Left at the default, that
# meant routine dependency bumps landed directly on main, bypassing the same review/CI
# path every other change goes through, and sat next to the real promotion PRs in the PR
# list looking like they were part of that pipeline when they weren't. Pointing Dependabot
# at development means these PRs flow through the same staging -> main promotion as
# everything else, and package.json/package-lock.json stay in sync across all three
# branches instead of main silently drifting ahead on dependency versions.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Bundles routine patch/minor bumps into one PR instead of one-PR-per-package --
      # keeps the review queue manageable on a solo-maintained project. Major version bumps
      # are excluded from the group so they still surface as individually-reviewed PRs.
      routine-updates:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "weekly"
