[build]
  functions = "netlify/functions"
  publish = "dist"
  # Astro build first (output: 'static', build.format: 'file' -- preserves the site's
  # existing about.html-style URLs). Then stamps the deploy's commit SHA into the service
  # worker's cache-version placeholder in the *built* dist/service-worker.js so every deploy
  # that touches a cached file gets a fresh cache name automatically -- no manual version
  # bump to remember, and the source file in public/ stays untouched. $COMMIT_REF is
  # provided by Netlify at build time.
  #
  # IMPORTANT: `command` must live directly under [build], not under [build.environment].
  # [build.environment] is a distinct TOML table reserved for environment variables -- a
  # `command` key placed there is read by Netlify as an env var named "command", not as the
  # actual build command. That bug shipped silently for a while: Netlify picked up `publish`
  # correctly (it's a real [build] key) but never ran any build command, so every deploy
  # skipped straight to publishing a `dist/` that was never created, and the site kept
  # serving whatever the last-successful-before-this-bug deploy was. Regression-tested in
  # tests/netlify-toml.test.js -- keep `command` here if you touch this file again.
  command = "npm run build && sed -i \"s/__CACHE_VERSION__/$COMMIT_REF/\" dist/service-worker.js"

[build.environment]
  # Astro 7 requires Node >=22.12.0 -- without this pin, Netlify's build image may default
  # to an older Node version and astro build would fail on the actual deploy even though it
  # builds fine locally (confirmed locally on Node v22.23.2). Matches the Node 24 already
  # pinned in ci.yml.
  NODE_VERSION = "22"

# Baseline security headers (security release). Honest caveat on script-src/style-src:
# every tool page wires up its buttons with inline onclick="..." handlers and inline
# style="..." attributes throughout the whole site, so 'unsafe-inline' is required on both
# or the entire site breaks -- that is a real, separate refactor (100+ handlers across 15
# pages) that shouldn't be rushed through as part of a headers change. This CSP does NOT
# block inline-script-based XSS on its own; the actual XSS fix is the escaping fix shipped
# alongside this. What it DOES meaningfully add: no framing (clickjacking protection via
# frame-ancestors, backed by X-Frame-Options for older browsers), no plugins/objects, no
# arbitrary form submission targets, and script/connect/frame sources locked to this site
# plus the one Google AdSense domain actually in use (pagead2.googlesyndication.com -- the
# loader is present sitewide but no ad units are live yet per the backlog; turning on real
# ad units later will likely require widening this list, e.g. adding
# googleads.g.doubleclick.net).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://pagead2.googlesyndication.com; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-src https://pagead2.googlesyndication.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Real incident: after shipping a CSS fix, a branch-alias URL (development--<site>.netlify.app)
# kept serving an old style.css for multiple deploys in a row -- confirmed via direct fetch
# that the exact same deploy's own permalink (<deploy-id>--<site>.netlify.app) served the
# correct, current file. So the build was never the problem: Netlify's edge/CDN had cached a
# stale response against the branch-alias hostname specifically, and even a "clear cache and
# deploy" (fresh build, no build-cache reuse) didn't dislodge it, because that clears Netlify's
# *build* cache, not a *served-response* cache already sitting at the edge for that path.
# no-cache (not no-store) forces the browser/CDN to revalidate with the origin on every
# request instead of trusting a cached copy for any length of time -- the origin can still
# answer with a cheap 304 if the file genuinely hasn't changed, so this isn't "never cache",
# just "never trust a cached copy without asking first". Scoped to CSS/JS only (matches
# service-worker.js's PRECACHE_URLS static-asset list) so images/fonts keep normal caching.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache"

# Narrow overrides for the two command-palette static assets (CR#8 #35/#70). Deliberately NOT
# folded into the sitewide no-cache policy above -- that policy exists for *application* JS
# that changes on every deploy (see the incident note above it); these two files have a
# fundamentally different, low change-cadence: fuse.min.js is a vendored third-party library
# only touched when manually upgraded, and palette-data.json only changes when
# src/data/tools.json does. Netlify applies the later-declared block's value when multiple
# [[headers]] blocks match the same path, so these must stay below the generic /*.js rule
# above to actually take effect. Goal: the palette's lazy dynamic-import (#70) shouldn't pay a
# revalidation round-trip on every single page it's reopened on, without reintroducing the
# stale-edge-cache risk a longer/immutable max-age would carry for files that do occasionally
# change.
[[headers]]
  for = "/tools/lib/fuse.min.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/palette-data.json"
  [headers.values]
    Cache-Control = "public, max-age=300"
