<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UtilX Analytics</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="../style.css">
<style>
  .stat-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin: 24px 0; }
  .stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
  .stat-card .num { font-size: 2rem; font-weight: 700; color: var(--accent); }
  .stat-card .label { color: var(--text-dim); font-size: 0.85rem; margin-top: 4px; }
  .stats-table { width: 100%; border-collapse: collapse; margin: 12px 0 32px; }
  .stats-table th, .stats-table td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
  .stats-table th { color: var(--text-dim); font-weight: 600; }
</style>
</head>
<body>

<header class="site">
  <div class="wrap">
    <a class="brand" href="/index.html">Util<span>X</span></a>
  </div>
</header>

<main>
  <div class="wrap">
    <h1>Analytics</h1>
    <p class="lede">Private dashboard — not linked from the site, blocked from search indexing.</p>

    <div class="card" id="login-card">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter dashboard password">
      <button onclick="loadStats()">View stats</button>
      <div id="msg"></div>
    </div>

    <div id="results" style="display:none;">
      <div class="stat-cards">
        <div class="stat-card"><div class="num" id="total-views">—</div><div class="label">Total pageviews</div></div>
        <div class="stat-card"><div class="num" id="unique-visitors">—</div><div class="label">Unique visitors</div></div>
      </div>

      <h2>Views by page</h2>
      <table class="stats-table" id="by-page-table"><thead><tr><th>Page</th><th>Views</th></tr></thead><tbody></tbody></table>

      <h2>Views by day</h2>
      <table class="stats-table" id="by-day-table"><thead><tr><th>Day</th><th>Views</th><th>Unique visitors</th></tr></thead><tbody></tbody></table>

      <h2>Top referrers</h2>
      <table class="stats-table" id="by-referrer-table"><thead><tr><th>Referrer</th><th>Views</th></tr></thead><tbody></tbody></table>
    </div>
  </div>
</main>

<script>
async function loadStats() {
  const password = document.getElementById('password').value;
  const msg = document.getElementById('msg');
  msg.innerHTML = '';
  try {
    const res = await fetch('/.netlify/functions/stats?password=' + encodeURIComponent(password));
    if (res.status === 401) {
      msg.innerHTML = '<div class="error-msg">Wrong password.</div>';
      return;
    }
    if (!res.ok) {
      msg.innerHTML = '<div class="error-msg">Something went wrong loading stats.</div>';
      return;
    }
    const data = await res.json();

    document.getElementById('total-views').textContent = data.total.total;
    document.getElementById('unique-visitors').textContent = data.total.unique_visitors;

    fillTable('by-page-table', data.byPage, ['path', 'views']);
    fillTable('by-day-table', data.byDay, ['day', 'views', 'unique_visitors']);
    fillTable('by-referrer-table', data.byReferrer, ['referrer', 'views']);

    document.getElementById('results').style.display = 'block';
  } catch (e) {
    msg.innerHTML = '<div class="error-msg">Network error: ' + e.message + '</div>';
  }
}

function fillTable(tableId, rows, cols) {
  const tbody = document.querySelector('#' + tableId + ' tbody');
  tbody.innerHTML = '';
  if (!rows || rows.length === 0) {
    tbody.innerHTML = '<tr><td colspan="' + cols.length + '">No data yet.</td></tr>';
    return;
  }
  rows.forEach(function (row) {
    const tr = document.createElement('tr');
    cols.forEach(function (col) {
      const td = document.createElement('td');
      td.textContent = row[col];
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}
</script>

</body>
</html>
