<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="utilx-icon-title">
<title id="utilx-icon-title">UtilX icon — comet streaking into the X</title>
<defs>
  <linearGradient id="tailBlue" x1="0%" y1="50%" x2="100%" y2="50%">
    <stop offset="0%" stop-color="#5b8cff" stop-opacity="0"/>
    <stop offset="45%" stop-color="#7fa4ff" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#eaf1ff" stop-opacity="1"/>
  </linearGradient>
  <radialGradient id="haloBlue" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#f3f7ff"/>
    <stop offset="45%" stop-color="#8fb3ff"/>
    <stop offset="100%" stop-color="#5b8cff" stop-opacity="0"/>
  </radialGradient>
  <filter id="blurLg" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="12"/>
  </filter>
  <filter id="blurTail" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="5.3"/>
  </filter>
</defs>

<rect x="0" y="0" width="512" height="512" rx="100" ry="100" fill="#0f1117"/>

<path d="M 340,203.2 C 248.8,227.2 164.8,242.8 133.6,242.32 L 128.8,244 L 133.6,245.68 C 164.8,245.2 248.8,260.8 340,284.8 A 40.8,40.8 0 0 1 340,203.2 Z" fill="url(#tailBlue)" filter="url(#blurTail)"/>
<circle cx="340" cy="244" r="40.8" fill="url(#haloBlue)" filter="url(#blurLg)"/>
<circle cx="340" cy="244" r="19.2" fill="none" stroke="#cddcff" stroke-width="2.88" opacity="0.7"/>
<circle cx="340" cy="244" r="8.4" fill="#f8faff"/>

<path d="M 347.2,200.8 L 404.8,287.2" stroke="#eef2ff" stroke-width="10.8" stroke-linecap="round"/>
<path d="M 404.8,200.8 L 347.2,287.2" stroke="#eef2ff" stroke-width="10.8" stroke-linecap="round"/>
</svg>
