<svg viewBox="295 145 150 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="utilx-logo-title">
<title id="utilx-logo-title">UtilX logo mark — comet streaking into the X</title>
<defs>
  <linearGradient id="tailBlue" x1="0%" y1="50%" x2="100%" y2="50%">
    <stop offset="0%" stop-color="#5b8cff" stop-opacity="0"/>
    <stop offset="45%" stop-color="#7fa4ff" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#eaf1ff" stop-opacity="1"/>
  </linearGradient>
  <radialGradient id="haloBlue" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#f3f7ff"/>
    <stop offset="45%" stop-color="#8fb3ff"/>
    <stop offset="100%" stop-color="#5b8cff" stop-opacity="0"/>
  </radialGradient>
  <filter id="blurLg" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="5"/>
  </filter>
  <filter id="blurTail" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="2.2"/>
  </filter>
</defs>

<path d="M 405,173 C 367,183 332,189.5 319,189.3 L 317,190 L 319,190.7 C 332,190.5 367,197 405,207 A 17,17 0 0 1 405,173 Z" fill="url(#tailBlue)" filter="url(#blurTail)"/>
<circle cx="405" cy="190" r="17" fill="url(#haloBlue)" filter="url(#blurLg)"/>
<circle cx="405" cy="190" r="8" fill="none" stroke="#cddcff" stroke-width="1.2" opacity="0.7"/>
<circle cx="405" cy="190" r="3.5" fill="#f8faff"/>

<path d="M 408,172 L 432,208" stroke="#eef2ff" stroke-width="4.5" stroke-linecap="round"/>
<path d="M 432,172 L 408,208" stroke="#eef2ff" stroke-width="4.5" stroke-linecap="round"/>
</svg>
